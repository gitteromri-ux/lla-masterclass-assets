<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLA — Julie Gibson Clark Masterclass Mockups</title>
<style>
  :root{--bg:#0b0f14;--fg:#e7ecf3;--muted:#8a94a6;--card:#111826;--accent:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:28px 20px 8px;max-width:1200px;margin:0 auto}
  h1{margin:0 0 6px;font-size:22px;letter-spacing:.2px}
  p.sub{margin:0;color:var(--muted);font-size:14px}
  main{max-width:1200px;margin:0 auto;padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid #1c2536;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card a.img{display:block;aspect-ratio:4/3;background:#0e1420;overflow:hidden}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{padding:10px 12px 12px}
  .name{font-size:13px;word-break:break-word}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .btn{font-size:12px;padding:6px 10px;border-radius:999px;background:#0e1420;color:var(--fg);text-decoration:none;border:1px solid #1c2536}
  .btn.primary{background:var(--accent);color:#08110a;border-color:transparent;font-weight:600}
  footer{max-width:1200px;margin:0 auto;padding:20px;color:var(--muted);font-size:12px}
  a{color:#8ab4ff}
</style>
</head>
<body>
<header>
  <h1>Julie Gibson Clark — LLA Masterclass Mockups</h1>
  <p class="sub">Public gallery of the final Zoom, stage, and device mockups. Tap any image to open full size, or Download.</p>
</header>
<main><div id="grid" class="grid"></div></main>
<footer>Source repo: <a href="https://github.com/gitteromri-ux/lla-masterclass-assets">github.com/gitteromri-ux/lla-masterclass-assets</a></footer>
<script>
const OWNER='gitteromri-ux', REPO='lla-masterclass-assets', BRANCH='main';
const EXT=/\.(png|jpe?g|webp|gif|svg)$/i;
const raw=p=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${p}`;
fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`)
  .then(r=>r.json())
  .then(d=>{
    const files=(d.tree||[]).filter(x=>x.type==='blob'&&EXT.test(x.path));
    files.sort((a,b)=>a.path.localeCompare(b.path));
    const g=document.getElementById('grid');
    if(!files.length){g.innerHTML='<p style="color:#8a94a6">No images found.</p>';return}
    g.innerHTML=files.map(f=>{
      const url=raw(f.path);
      const name=f.path.split('/').pop();
      return `<div class="card">
        <a class="img" href="${url}" target="_blank" rel="noopener"><img loading="lazy" src="${url}" alt="${name}"></a>
        <div class="meta">
          <div class="name">${f.path}</div>
          <div class="row">
            <a class="btn primary" href="${url}" download>Download</a>
            <a class="btn" href="${url}" target="_blank" rel="noopener">Open</a>
          </div>
        </div>
      </div>`;
    }).join('');
  })
  .catch(e=>{document.getElementById('grid').innerHTML='<p style="color:#f87171">Failed to load file list.</p>';});
</script>
</body>
</html>
