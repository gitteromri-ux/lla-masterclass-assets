<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Julie Gibson Clark · Film</title>
<style>html,body{margin:0;height:100%;background:#000}body{display:flex;align-items:center;justify-content:center}
.w{position:relative;width:100vw;height:100vh}video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#snd{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-family:Inter,system-ui,sans-serif;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#06111f;background:#fff;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#snd.off{display:none}</style></head>
<body><div class="w"><video id="v" src="video/julie-film-autoplay.mp4" poster="poster.jpg" autoplay muted loop playsinline></video>
<button id="snd">Tap for sound</button></div>
<script>const v=document.getElementById('v'),b=document.getElementById('snd');b.onclick=()=>{v.muted=false;v.currentTime=0;v.play();b.classList.add('off')};v.play().catch(()=>{});</script>
</body></html>
